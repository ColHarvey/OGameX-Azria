services:

  # MariaDB Service
  ogamex-db:
    image: mariadb:11.3.2-jammy
    restart: unless-stopped
    tty: true
    volumes:
     - ogame-dbdata:/var/lib/mysql
     - ./mysql/my.cnf:/etc/mysql/my.cnf
    # MariaDB port is not exposed to the host machine in production.
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: toor
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    networks:
      app-network:
        aliases:
          - ogame-db

  # PHP Service
  ogamex-app:
    volumes:
      - ./:/var/www:cached
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPCACHE_ENABLE: "1" # Enable opcache in production
    restart: unless-stopped
    tty: true
    environment:
      CONTAINER_ROLE: app
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000 || [ $? -eq 56 ]"]
      interval: 10s
      timeout: 6s
      retries: 60
    networks:
      - app-network
    depends_on:
      - ogamex-db

  # Nginx Service
  ogamex-webserver:
    image: nginx:alpine
    restart: unless-stopped
    tty: true
    volumes:
      - ./:/var/www:cached
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ./nginx/ssl/:/etc/nginx/ssl/
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  # Scheduler
  ogamex-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www:cached
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: scheduler
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  # Queue
  ogamex-queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www:cached
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: queue
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  # Reverb WebSocket Server
  ogamex-reverb:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www:cached
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      CONTAINER_ROLE: reverb
    ports:
      - "${REVERB_SERVER_PORT:-8090}:${REVERB_SERVER_PORT:-8090}"
    networks:
      - app-network
    depends_on:
      ogamex-app:
        condition: service_healthy

  # PhpMyAdmin
  ogamex-phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=ogame-db
      - UPLOAD_LIMIT=1G
    networks:
      - app-network
    volumes:
      - ./docker/phpmyadmin/.htaccess:/var/www/html/.htaccess

  # Traducteur du chat general (LibreTranslate)
  #
  # **Aucun port publie, et c'est delibere.** Le navigateur ne lui parle jamais : le jeu expose une
  # route qui exige une session et borne le debit, et c'est elle seule qui interroge ce conteneur.
  # Publier un port ferait de lui une API de traduction gratuite pour qui la trouverait.
  #
  # `LT_LOAD_ONLY` est le levier qui compte : chaque langue chargee coute de la memoire et du
  # disque. La liste par defaut couvre les langues que le jeu sert et celles qu'on croise le plus
  # en jeu ; l'elargir se fait dans le `.env`, sans toucher a ce fichier.
  #
  # **Ajouter une langue demande de vider le volume.** Mesure faite : l'etape « Updating language
  # models » ne s'execute que sur un volume vide. Une fois les modeles installes, le conteneur
  # charge ce qu'il trouve et filtre selon `LT_LOAD_ONLY` — il ne va jamais en chercher un
  # nouveau, et son journal ne mentionne meme pas la tentative. Changer la liste dans le `.env`
  # puis recreer le conteneur **ne suffit pas** :
  #
  #   ogamex stop ogamex-libretranslate && ogamex rm -f ogamex-libretranslate
  #   docker volume rm ogamex_libretranslate-models
  #   ogamex up -d ogamex-libretranslate
  #
  # `LT_UPDATE_MODELS: "false"` a ete retire au passage. Il evitait une verification reseau au
  # demarrage ; **rien ne prouve qu'il bloquait l'installation** — le vidage du volume a eu lieu
  # en meme temps et suffit a expliquer ce qu'on a vu. Il reste dehors parce que l'etape qu'il
  # supprime porte precisement le nom de celle qui installe les modeles.
  #
  # Les modeles vivent dans un volume nomme : sans lui, chaque redemarrage les retelecharge.
  #
  # **Le montage vise `.local`, pas le dossier des modeles.** Docker n initialise un volume neuf
  # avec le contenu ET les droits de l image que si le chemin monte existe dedans. Mesure faite
  # sur l image : l utilisateur est `libretranslate` (1032:65534), `/home/libretranslate/.local`
  # existe et lui appartient, mais `.local/share/argos-translate` n existe pas. Monte la-bas, le
  # volume naissait vide et appartenant a root, et le conteneur redemarrait en boucle sur
  # « PermissionError ... /packages ». Monte sur `.local`, il herite des bons droits.
  ogamex-libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "${LIBRETRANSLATE_LANGUAGES:-en,fr,es,de,it,pt,nl}"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    networks:
      - app-network

# Docker Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  ogame-dbdata:
    driver: local
  libretranslate-models:
    driver: local
