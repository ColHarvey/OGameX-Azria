name: Validation MariaDB des migrations

# Les tests tournent sur SQLite, la production sur MariaDB. SQLite ne voit pas certaines
# incompatibilites : un type de cle etrangere qui ne correspond pas exactement a la colonne
# referencee, une colonne JSON, une longueur d'index. Une suite verte ne prouve donc rien
# quant a MariaDB.
#
# Ce workflow applique les migrations sur une base MariaDB **jetable**, les defait, les
# reapplique, puis lit les contraintes reellement produites. Aucun acces au serveur de
# production n'est necessaire, et rien ne survit a la fin du travail.
#
# Il ne remplace pas la suite de tests : il repond a une question qu'elle ne peut pas poser.

on:
  push:
    branches:
      - combats-persistants
      - 'wip/**'
    paths:
      - 'database/migrations/**'
      - '.github/workflows/migrations-mariadb.yml'
      - 'app/Combat/**'
      - 'app/GameMissions/**'
      - 'tests/MariaDb/**'
      - 'tests/*.php'
      - 'tests/Feature/Combat/**'
      - 'phpunit.mariadb.xml'
  pull_request:
    paths:
      - 'database/migrations/**'
      - '.github/workflows/migrations-mariadb.yml'
      - 'app/Combat/**'
      - 'app/GameMissions/**'
      - 'tests/MariaDb/**'
      - 'tests/*.php'
      - 'tests/Feature/Combat/**'
      - 'phpunit.mariadb.xml'
  # Lancement manuel : indispensable, parce qu'un filtre sur les chemins ne rattrape pas des
  # migrations poussees avant que ce workflow n'existe.
  workflow_dispatch:

jobs:
  cycle:
    name: migrate, rollback, migrate
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.3.2-jammy
        env:
          MARIADB_ROOT_PASSWORD: essai
          MARIADB_DATABASE: ogamex_essai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, bcmath, gd, zip, intl
          coverage: none

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparer la configuration
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql

      # Aucun cache de configuration n'est ecrit ici, contrairement au conteneur de
      # production : les variables ci-dessous sont donc bien celles qu'utilise Laravel.
      - name: Verifier la base visee avant toute migration
        run: |
          BASE=$(php artisan tinker --execute="echo config('database.connections.mysql.database');")
          echo "Laravel vise : $BASE"
          test "$BASE" = "ogamex_essai" || { echo "ARRET : Laravel ne vise pas la base d'essai."; exit 1; }
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ogamex_essai
          DB_USERNAME: root
          DB_PASSWORD: essai

      - name: Cycle migrate → rollback → migrate
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=3 --force
          php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ogamex_essai
          DB_USERNAME: root
          DB_PASSWORD: essai

      # RESTRICT etant le comportement par defaut de MariaDB, SHOW CREATE TABLE peut ne pas
      # l'ecrire. On interroge donc la regle elle-meme, pas son affichage.
      - name: Verifier les contraintes reellement produites
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -pessai ogamex_essai <<'SQL'
            SELECT 'types des colonnes' AS controle;
            SELECT TABLE_NAME, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE
              FROM information_schema.COLUMNS
             WHERE TABLE_SCHEMA = 'ogamex_essai'
               AND (TABLE_NAME IN ('combat_instances', 'combat_participants', 'combat_presentation_events', 'combat_outbox', 'combat_fleet_dispositions', 'celestial_body_combat_barriers')
                    OR (TABLE_NAME = 'fleet_missions' AND COLUMN_NAME = 'combat_instance_id'))
             ORDER BY TABLE_NAME, ORDINAL_POSITION;

            SELECT 'regle de suppression de la cle etrangere' AS controle;
            SELECT CONSTRAINT_NAME, DELETE_RULE, REFERENCED_TABLE_NAME
              FROM information_schema.REFERENTIAL_CONSTRAINTS
             WHERE CONSTRAINT_SCHEMA = 'ogamex_essai'
               AND TABLE_NAME LIKE 'combat%';

            SELECT 'index et unicite' AS controle;
            SELECT TABLE_NAME, INDEX_NAME, NON_UNIQUE, GROUP_CONCAT(COLUMN_NAME ORDER BY SEQ_IN_INDEX) AS colonnes
              FROM information_schema.STATISTICS
             WHERE TABLE_SCHEMA = 'ogamex_essai'
               AND TABLE_NAME IN ('combat_instances', 'combat_participants', 'combat_presentation_events', 'combat_outbox', 'combat_fleet_dispositions', 'celestial_body_combat_barriers')
             GROUP BY TABLE_NAME, INDEX_NAME, NON_UNIQUE
             ORDER BY TABLE_NAME, INDEX_NAME;
          SQL

      - name: Faire echouer si une garantie manque
        run: |
          verifier() {
            RESULTAT=$(mysql -h 127.0.0.1 -P 3306 -uroot -pessai -N -B ogamex_essai -e "$2")
            if [ "$RESULTAT" != "$3" ]; then
              echo "ECHEC — $1"
              echo "  attendu : $3"
              echo "  obtenu  : $RESULTAT"
              exit 1
            fi
            echo "OK — $1"
          }

          verifier "la cle etrangere refuse la suppression en cascade" \
            "SELECT DELETE_RULE FROM information_schema.REFERENTIAL_CONSTRAINTS WHERE CONSTRAINT_SCHEMA='ogamex_essai' AND CONSTRAINT_NAME='combat_part_instance_fk';" \
            "RESTRICT"

          verifier "l'identite du participant n'est pas nullable" \
            "SELECT IS_NULLABLE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='ogamex_essai' AND TABLE_NAME='combat_participants' AND COLUMN_NAME='participant_key';" \
            "NO"

          verifier "l'index d'identite est unique" \
            "SELECT NON_UNIQUE FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='ogamex_essai' AND TABLE_NAME='combat_participants' AND INDEX_NAME='combat_part_unique_idx' LIMIT 1;" \
            "0"

          # Les cinq colonnes qui designent une cle primaire en bigint. Quatre d'entre elles
          # etaient des `int` : SQLite ne faisait aucune difference, mais MariaDB aurait refuse
          # d'y attacher une cle etrangere le jour ou on en ajouterait une.
          verifier_bigint() {
            verifier "$1.$2 tient sur un bigint" \
              "SELECT COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='ogamex_essai' AND TABLE_NAME='$1' AND COLUMN_NAME='$2';" \
              "bigint(20) unsigned"
          }

          verifier_bigint combat_participants combat_instance_id
          verifier_bigint combat_participants fleet_mission_id
          verifier_bigint combat_instances mission_id
          verifier_bigint combat_instances union_id
          verifier_bigint combat_instances battle_report_id

          # Et la colonne ajoutee a fleet_missions, qui designe le combat.
          verifier_bigint fleet_missions combat_instance_id

  # Les courses et les transactions, sur la vraie base. SQLite ne verrouille rien ligne par ligne
  # (`lockForUpdate()` n'y compile a rien) et ne connait qu'un ecrivain a la fois : un double
  # reglement, une disposition consommee deux fois ou un rollback qui laisse une trace ne s'y
  # voient pas. Ici, deux processus reels se disputent la meme ligne, et une seconde connexion
  # mesure la portee des verrous. Les epreuves de rejeu et de rollback du reglement, deja vertes
  # sous SQLite, rejouent sur de vraies transactions.
  courses:
    name: courses et transactions
    runs-on: ubuntu-latest
    needs: cycle
    services:
      mariadb:
        image: mariadb:11.3.2-jammy
        env:
          MARIADB_ROOT_PASSWORD: essai
          MARIADB_DATABASE: ogamex_essai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, bcmath, gd, zip, intl, pcntl, posix
          coverage: none

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist --no-progress

      # Le meme environnement minimal que la suite SQLite, la base en moins : tout le reste aux
      # valeurs par defaut de Laravel. Partir de `.env.example` viserait Reverb sur localhost.
      - name: Preparer l environnement
        run: |
          set -euo pipefail
          {
            echo "APP_NAME=OGameX"
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            echo "APP_KEY="
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=ogamex_essai"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=essai"
          } > .env
          php artisan key:generate --force
          grep -E "^(APP_ENV|DB_CONNECTION|DB_DATABASE)=" .env

      - name: Verifier la base visee
        run: |
          BASE=$(php artisan tinker --execute="echo config('database.connections.mysql.database');")
          echo "Laravel vise : $BASE"
          test "$BASE" = "ogamex_essai" || { echo "ARRET : Laravel ne vise pas la base d'essai."; exit 1; }

      - name: Appliquer les migrations
        run: php artisan migrate --force

      - name: Courses et transactions
        run: |
          set -o pipefail
          mkdir -p storage/logs
          vendor/bin/phpunit -c phpunit.mariadb.xml --log-junit storage/logs/junit-mariadb.xml 2>&1 | tee storage/logs/console-mariadb.txt

      # Les quatre compteurs, pas seulement le code de sortie : un fichier qui ne charge pas
      # rend zero essai et un vert vide.
      - name: Lire les quatre compteurs
        if: always()
        run: php scripts/verifier-junit.php storage/logs/junit-mariadb.xml --minimum=124 --sans-ignores

      - name: Publier les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-courses-${{ github.sha }}
          path: |
            storage/logs/junit-mariadb.xml
            storage/logs/console-mariadb.txt
            storage/logs/laravel*.log
          if-no-files-found: warn
