name: Moteur Rust et couture FFI

# Pourquoi ce workflow existe
#
# Le moteur Rust est obligatoire en production : le conteneur compile
# `libbattle_engine_ffi.so` a son demarrage, et `RustBattleEngine` la charge par FFI. Aucun repli
# vers PHP n'est admis.
#
# Le poste de developpement est sous Windows et ne possede ni Rust, ni Docker, ni WSL. Meme avec
# Rust installe, Windows produirait un `.dll`, pas le `.so` que la couture attend. La chaine ne peut
# donc etre eprouvee que sur Linux, et **ce workflow est la preuve canonique** : un run vert sur un
# autre hash ne valide pas le candidat.
#
# Deux jobs, deux verdicts lisibles separement, sur le meme SHA :
#
#   - `moteur-rust` : compilation par le script de production, essais Rust natifs, groupe PHP du
#     moteur (FFI, contrat, pertes par participant, banc de parite) avec zero ignore exige. Quelques
#     minutes. Un vert ici ne fait pas un candidat.
#   - `suite-complete` : toute la suite du jeu, par le lanceur `scripts/suite.php`, parallelisee sur
#     les coeurs du runner — chaque processus a sa base SQLite, sa remise a zero protegee par le
#     verrou, et le JUnit agrege est verifie. Une quarantaine de minutes en sequentiel ; bien moins
#     ici. La validation complete reste requise sur le candidat final.
#
# Les deux jobs compilent la bibliotheque par le meme script, sur le meme SHA ; chacun publie
# l'empreinte du `.so` pour qu'on puisse verifier qu'ils ont eprouve la meme.

on:
  push:
    branches:
      - combats-persistants
      - 'wip/**'
  pull_request:
  workflow_dispatch:

jobs:
  moteur-rust:
    name: Rust, FFI et parite
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # **Le SHA exact, affiche d'emblee.** Un artefact ou un resume qui ne nomme pas son hash ne
      # valide rien : la question est toujours « ce commit-la est-il bon ? ».
      - name: Nommer le candidat
        run: |
          {
            echo "## Rust, FFI et parite"
            echo ""
            echo "| Champ | Valeur |"
            echo "| --- | --- |"
            echo "| SHA | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Installer la chaine Rust
        uses: dtolnay/rust-toolchain@stable

      # **Le meme script que l'image de production.** Recopier une seconde commande de compilation
      # ici ferait deriver les deux : le jour ou l'image changerait de cible, de profil ou de nom de
      # bibliotheque, ce workflow validerait autre chose que ce qui tourne.
      - name: Compiler par le script de production
        run: |
          mkdir -p storage/rust-libs
          chmod +x rust/compile.sh
          ./rust/compile.sh

      # **Existe, et est bien une bibliotheque ELF.** Un fichier present mais vide, ou un binaire
      # d'une autre plateforme, se chargerait mal plus tard et l'erreur parlerait d'autre chose.
      - name: Verifier la bibliotheque
        run: |
          set -euo pipefail
          test -s storage/rust-libs/libbattle_engine_ffi.so
          file storage/rust-libs/libbattle_engine_ffi.so | tee /tmp/so.txt
          grep -q 'ELF .*shared object' /tmp/so.txt
          sha256sum storage/rust-libs/*.so | tee /tmp/so-sha256.txt

      - name: Installer PHP avec FFI
        uses: shivammathur/setup-php@v2
        with:
          # La meme version que le `Dockerfile` : eprouver la couture sous une autre ne dirait rien
          # de celle qui tourne.
          php-version: '8.5'
          extensions: ffi, sqlite3, pdo_sqlite, bcmath, gd, zip, intl
          ini-values: ffi.enable=1, memory_limit=2G

      - name: Verifier que FFI est chargee et activee
        run: |
          set -euo pipefail
          php -r 'exit(extension_loaded("FFI") ? 0 : 1);'
          php -r 'exit(in_array(ini_get("ffi.enable"), ["1", "true", "preload"], true) ? 0 : 1);'
          php -r '$f = FFI::cdef("", "storage/rust-libs/libbattle_engine_ffi.so"); echo "bibliotheque chargee\n";'

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist --no-progress

      # **Le meme environnement que le poste de developpement, et rien de plus.** Le `.env` d'un
      # poste de test tient en six lignes ; tout le reste — diffusion `log`, file `database`, cache
      # et session en base — vient des valeurs par defaut de Laravel. Partir de `.env.example`
      # (Reverb sur localhost:8090, MariaDB `ogamex-db`) faisait tomber vingt-deux essais qui
      # n'ont rien a voir avec le combat, et le lanceur n'avait aucune base a vider.
      - name: Preparer l environnement
        run: |
          set -euo pipefail
          {
            echo "APP_NAME=OGameX"
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            echo "APP_KEY="
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite"
          } > .env
          php artisan key:generate --force
          touch database/database.sqlite
          grep -E "^(APP_ENV|DB_CONNECTION|DB_DATABASE)=" .env

      # **Les essais natifs du moteur**, depuis le manifeste que le script de construction utilise.
      # `--locked` refuse une resolution de dependances differente de celle qui est versionnee.
      - name: Executer les essais Rust natifs
        run: cargo test --manifest-path rust/Cargo.toml --locked --all-targets

      # **Une seule execution, sequentielle, avec son rapport.** Le groupe est court ; le lire comme
      # une structure evite de chercher le mot « ignore » dans du texte. La sortie console est
      # conservee dans l'artefact, et le code de sortie reste celui du lanceur, jamais celui de tee.
      - name: Executer le groupe du moteur
        shell: bash
        run: |
          set -o pipefail
          php scripts/suite.php --sequentiel --filter Rust --log-junit=storage/logs/junit-rust.xml 2>&1 | tee storage/logs/console-rust.txt

      # C'est ici que le job gagne son sens : ces essais sont **ignores** partout ailleurs faute de
      # bibliotheque. Un code de sortie vert ne suffit pas — une suite entierement sautee sort verte
      # aussi. 42 : les 30 essais historiques du moteur, les pertes par participant (2), le contrat
      # FFI (4) et le banc de parite (6). Un fichier d'essai qui disparaitrait ferait tomber le compte.
      - name: Exiger les essais Rust executes, aucun ignore
        run: php scripts/verifier-junit.php storage/logs/junit-rust.xml --minimum=42 --sans-ignores

      - name: Resumer le verdict
        if: always()
        run: |
          {
            echo "| PHP | \`$(php -r 'echo PHP_VERSION;')\` |"
            echo "| Rust | \`$(rustc --version 2>/dev/null || echo absent)\` |"
            echo "| Empreinte du .so | \`$(sha256sum storage/rust-libs/libbattle_engine_ffi.so 2>/dev/null | cut -d' ' -f1 || echo absent)\` |"
            echo ""
            echo '```'
            echo "groupe Rust : $(php scripts/verifier-junit.php storage/logs/junit-rust.xml 2>&1 | head -1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # **Publie meme en echec.** Un run rouge est precisement celui qu'on veut lire, et l'artefact
      # porte le SHA pour qu'il ne soit jamais confondu avec un autre.
      - name: Publier l artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-validation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            storage/logs/junit-rust.xml
            storage/logs/console-rust.txt
            storage/logs/parite-*.json
            storage/logs/*.log
            storage/framework/testing/migrate-*.log
            /tmp/so.txt
            /tmp/so-sha256.txt

  suite-complete:
    name: Suite complete du jeu
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Nommer le candidat
        run: |
          {
            echo "## Suite complete du jeu"
            echo ""
            echo "| Champ | Valeur |"
            echo "| --- | --- |"
            echo "| SHA | \`${GITHUB_SHA}\` |"
            echo "| Coeurs | \`$(nproc)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Installer la chaine Rust
        uses: dtolnay/rust-toolchain@stable

      # La meme bibliotheque que l'autre job : meme script, meme SHA. L'empreinte publiee permet de
      # verifier que les deux ont eprouve le meme `.so`.
      - name: Compiler par le script de production
        run: |
          mkdir -p storage/rust-libs
          chmod +x rust/compile.sh
          ./rust/compile.sh
          sha256sum storage/rust-libs/*.so | tee /tmp/so-sha256.txt

      - name: Installer PHP avec FFI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi, sqlite3, pdo_sqlite, bcmath, gd, zip, intl
          ini-values: ffi.enable=1, memory_limit=2G

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparer l environnement
        run: |
          set -euo pipefail
          {
            echo "APP_NAME=OGameX"
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            echo "APP_KEY="
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite"
          } > .env
          php artisan key:generate --force
          touch database/database.sqlite

      # **Toute la suite, par le lanceur, sur les coeurs du runner.** Le lanceur prend le verrou,
      # remet a zero une base par processus, puis lance ParaTest : chaque processus garde sa propre
      # base SQLite et ses ressources ; rien ne contourne la remise a zero protegee. Le nombre de
      # processus est celui des coeurs du runner, pas les seize du poste local. La duree murale est
      # mesuree et publiee, avec le JUnit agrege — c'est lui qui compte les essais, pas la console.
      - name: Executer la suite complete
        shell: bash
        run: |
          set -o pipefail
          debut=$(date +%s)
          php scripts/suite.php --processus="$(nproc)" --log-junit=storage/logs/junit-suite.xml 2>&1 | tee storage/logs/console-suite.txt
          code=$?
          echo "DUREE_SUITE=$(( $(date +%s) - debut ))" >> "$GITHUB_ENV"
          exit $code

      # **Le JUnit agrege compte toute la suite** : 2 188 essais au 4 septembre 2026, et aucun ignore
      # — la bibliotheque existe ici, donc les essais Rust s'executent dans la suite aussi. Un
      # rapport qui en compterait moins signalerait des essais perdus dans la parallelisation.
      - name: Exiger une suite entiere sans ignore
        run: php scripts/verifier-junit.php storage/logs/junit-suite.xml --minimum=2100 --sans-ignores

      - name: Resumer le verdict
        if: always()
        run: |
          {
            echo "| Empreinte du .so | \`$(cut -d' ' -f1 /tmp/so-sha256.txt 2>/dev/null | head -1 || echo absent)\` |"
            echo "| Duree murale de la suite | \`${DUREE_SUITE:-inconnue} s\` |"
            echo ""
            echo '```'
            echo "suite : $(php scripts/verifier-junit.php storage/logs/junit-suite.xml 2>&1 | head -1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-complete-${{ github.sha }}
          if-no-files-found: warn
          path: |
            storage/logs/junit-suite.xml
            storage/logs/console-suite.txt
            storage/logs/*.log
            storage/framework/testing/migrate-*.log
            /tmp/so-sha256.txt
